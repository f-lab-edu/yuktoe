name: yuktoe
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  flutter_dotenv: ^6.0.0
  provider: ^6.1.5+1
  flutter_svg: ^2.2.4
  kakao_flutter_sdk: ^1.10.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.6.3
  flutter_lints: ^5.0.0
  build_runner: ^2.13.1
  flutter_gen_runner:


flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/icons/

flutter_gen:
  integrations:
    flutter_svg: true
